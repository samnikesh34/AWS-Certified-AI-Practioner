{% extends 'base.html' %}{% block body %}<h1>Learn through examples</h1><form method="get" class="search"><label>Search concepts<input name="q" value="{{ request.args.get('q','') }}" placeholder="Try precision, Bedrock, bias…"></label><button>Search</button></form><h2>65 concept deep dives</h2><div class="grid">{% for c in concepts %}<a class="card" href="/topic/{{ c.id }}"><h3>{{ c.label }}</h3><p>{{ c.meaning }}</p><small>{{ domains[c.domain-1] }}</small></a>{% endfor %}</div><h2>Section-by-section reference</h2>{% for l in lessons %}<p><a href="/reference/{{ l.id }}">{{ l.title }}</a></p>{% endfor %}{% endblock %}
