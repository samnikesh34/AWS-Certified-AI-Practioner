{% extends 'base.html' %}{% block body %}<section class="card"><h1>Recover your account</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Username<input name="username" required></label><label>Recovery key<input name="recovery" required autocomplete="off"></label><label>New password<input type="password" name="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><button>Reset password</button></form><p>This invalidates other login sessions and replaces your recovery key.</p><a href="/auth">Back to sign in</a></section>{% endblock %}
